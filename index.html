<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hangout Planner</title>
  <!-- LZ-String library for ultra-compact URL hashes -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f0f;color:#f0ebe0;font-family:'Courier New',monospace;min-height:100vh;padding:2rem 1rem 4rem}
    .app{max-width:620px;margin:0 auto}
    .logo{text-align:center;margin-bottom:2.5rem}
    .logo h1{font-family:Georgia,serif;font-size:clamp(2rem,8vw,3.2rem);font-weight:700;color:#ffffff}
    .logo h1 em{font-style:italic;font-weight:400;color:#f5b358}
    .logo p{font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;color:#a8a39a;margin-top:0.35rem}
    .card{background:#181818;border:1px solid #333333;border-radius:6px;padding:1.5rem 1.6rem;margin-bottom:1.1rem}
    .card-title{font-family:Georgia,serif;font-size:1.1rem;color:#ffffff;margin-bottom:1.1rem;display:flex;align-items:center;gap:0.55rem}
    .num{width:1.5rem;height:1.5rem;background:#f5b358;color:#0f0f0f;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0}
    label{display:block;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:#b8b4ac;margin-bottom:0.35rem;margin-top:0.85rem;font-weight:600}
    label:first-of-type{margin-top:0}
    input,select{width:100%;padding:0.55rem 0.75rem;background:#111;border:1px solid #3d3d3d;border-radius:4px;color:#ffffff;font-family:'Courier New',monospace;font-size:0.88rem;outline:none}
    input:focus,select:focus{border-color:#f5b358}
    select option{background:#181818;color:#ffffff}
    .slot-row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:0.5rem;align-items:end;margin-bottom:0.65rem}
    .btn{padding:0.5rem 1rem;border:1px solid #555;border-radius:4px;background:transparent;color:#f0ebe0;font-family:'Courier New',monospace;font-size:0.8rem;cursor:pointer;white-space:nowrap}
    .btn-gold{background:#f5b358;border-color:#f5b358;color:#0f0f0f;font-weight:700}
    .btn-full{width:100%;padding:0.85rem;font-size:0.88rem;letter-spacing:0.1em;text-transform:uppercase;border:1px solid #f5b358;border-radius:4px;background:#f5b358;color:#0f0f0f;font-family:'Courier New',monospace;cursor:pointer;font-weight:700}
    .btn-gray-full{width:100%;padding:0.8rem;font-size:0.85rem;border:1px solid #555;border-radius:4px;background:transparent;color:#d4cfc7;font-family:'Courier New',monospace;cursor:pointer}
    .btn-sm{padding:0.35rem 0.65rem;border:1px solid #444;border-radius:3px;background:transparent;color:#b8b4ac;font-family:'Courier New',monospace;font-size:0.75rem;cursor:pointer}
    .btn-sm:hover{color:#ffffff;border-color:#777}
    .hint{font-size:0.78rem;color:#a8a39a;line-height:1.55;margin-top:0.3rem}
    .divider{height:1px;background:#2a2a2a;margin:1.1rem 0}
    .tag-wrap{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.6rem}
    .tag{background:#242424;border:1px solid #3d3d3d;border-radius:3px;padding:0.3rem 0.6rem;font-size:0.78rem;display:inline-flex;align-items:center;gap:0.4rem;color:#e8e4dc}
    .tag button{background:none;border:none;cursor:pointer;color:#a8a39a;font-size:0.95rem;padding:0;line-height:1}
    .tag button:hover{color:#ffffff}
    .msg-box{background:#111;border:1px solid #333;border-radius:4px;padding:0.9rem 1.1rem;font-size:0.82rem;line-height:1.75;white-space:pre-wrap;color:#e8e4dc;max-height:220px;overflow-y:auto;word-break:break-word}
    .share-box{background:#111;border:1px solid #333;border-radius:4px;padding:0.75rem 0.9rem;font-size:0.78rem;color:#c2beba;word-break:break-all;line-height:1.5}
    .btn-row{display:flex;gap:0.55rem;flex-wrap:wrap;margin-top:0.75rem}
    .poll-header{text-align:center;margin-bottom:1.8rem;padding-top:1rem}
    .poll-header h2{font-family:Georgia,serif;font-size:clamp(1.5rem,5vw,2.2rem);color:#ffffff}
    .poll-header p{color:#a8a39a;font-size:0.85rem;margin-top:0.4rem}
    .slot-opt{background:#141414;border:1.5px solid #333333;border-radius:5px;padding:0.9rem 1.1rem;margin-bottom:0.75rem;cursor:pointer;display:flex;align-items:center;gap:0.9rem;transition:border-color 0.15s ease}
    .slot-opt.selected{background:#201c14;border-color:#f5b358}
    .slot-chk{width:1.3rem;height:1.3rem;border:1.5px solid #555;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:bold}
    .slot-opt.selected .slot-chk{background:#f5b358;border-color:#f5b358;color:#0f0f0f}
    .slot-date{font-size:0.95rem;color:#ffffff;font-weight:600}
    .slot-time{font-size:0.85rem;color:#f0ebe0;margin-top:0.25rem}
    .slot-orig{font-size:0.74rem;color:#88847c;margin-top:0.15rem}
    .tz-badge{font-size:0.7rem;background:#242424;border:1px solid #3d3d3d;padding:0.15rem 0.4rem;border-radius:3px;color:#d4cfc7;margin-left:0.3rem}
    .success-box{background:#0d2b12;border:1px solid #397a44;border-radius:5px;padding:1.3rem 1.4rem;text-align:center}
    .success-box h3{font-family:Georgia,serif;color:#6fcf83;font-size:1.2rem;margin-bottom:0.4rem}
    .success-box p{font-size:0.85rem;color:#d4cfc7;line-height:1.6}
    .error-box{background:#2b0d0d;border:1px solid #7a3333;border-radius:5px;padding:0.8rem 1rem;font-size:0.82rem;color:#f08888;margin-top:0.6rem}
    .spinner{display:inline-block;width:0.9rem;height:0.9rem;border:2px solid #444;border-top-color:#f5b358;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:0.4rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    input[type=date]::-webkit-calendar-picker-indicator, input[type=time]::-webkit-calendar-picker-indicator{filter:invert(0.85)}
    a{text-decoration:none}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}
    .grid3{display:grid;grid-template-columns:1fr 1fr auto;gap:0.5rem;align-items:end}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwTsq_gQLXtVlZPJaajfk9bScQscfq8fXeok2li5UME1uLFinmgpO7RjQ4UPiC3a2bE/exec";

const LOCAL_IANA_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Denver";

function getTzAbbr(ianaTz, dateObj = new Date()) {
  try {
    const dtf = new Intl.DateTimeFormat('en-US', { timeZoneName: 'short', timeZone: ianaTz });
    const parts = dtf.formatToParts(dateObj);
    const tzPart = parts.find(p => p.type === 'timeZoneName');
    return tzPart ? tzPart.value : ianaTz;
  } catch (e) {
    return ianaTz;
  }
}

function parseIsoSlotToDate(dateStr, timeStr, sourceIanaTz) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [h, min] = timeStr.split(":").map(Number);
  const tempUtc = new Date(Date.UTC(y, m - 1, d, h, min, 0));
  
  const invTzFormatter = new Intl.DateTimeFormat('en-US', {
    timeZone: sourceIanaTz,
    year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: 'numeric', second: 'numeric',
    hour12: false
  });
  
  const parts = invTzFormatter.formatToParts(tempUtc);
  const p = {};
  parts.forEach(({ type, value }) => { p[type] = parseInt(value, 10); });
  if (p.hour === 24) p.hour = 0;
  
  const targetTimeInSourceTz = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  const tzOffsetMs = targetTimeInSourceTz - tempUtc.getTime();
  return new Date(tempUtc.getTime() - tzOffsetMs);
}

function formatSlotDisplay(dateStr, startStr, endStr, orgIanaTz) {
  const startDate = parseIsoSlotToDate(dateStr, startStr, orgIanaTz);
  const endDate = parseIsoSlotToDate(dateStr, endStr, orgIanaTz);
  
  const userTz = LOCAL_IANA_TZ;
  const userAbbr = getTzAbbr(userTz, startDate);
  const orgAbbr = getTzAbbr(orgIanaTz, startDate);
  const isDifferentTz = userTz !== orgIanaTz;
  
  const dateFmt = new Intl.DateTimeFormat('en-US', {
    weekday: 'short', month: 'short', day: 'numeric', timeZone: userTz
  });
  const timeFmt = new Intl.DateTimeFormat('en-US', {
    hour: 'numeric', minute: 'numeric', hour12: true, timeZone: userTz
  });
  
  const orgTimeFmt = new Intl.DateTimeFormat('en-US', {
    hour: 'numeric', minute: 'numeric', hour12: true, timeZone: orgIanaTz
  });

  return {
    localDate: dateFmt.format(startDate),
    localTime: `${timeFmt.format(startDate)} – ${timeFmt.format(endDate)} (${userAbbr})`,
    orgTimeNotice: isDifferentTz ? `${orgTimeFmt.format(startDate)} – ${orgTimeFmt.format(endDate)} ${orgAbbr}` : null,
    fullLabel: `${dateFmt.format(startDate)}: ${timeFmt.format(startDate)} – ${timeFmt.format(endDate)} (${userAbbr})`
  };
}

function todayStr(){ return new Date().toISOString().split("T")[0]; }
function uid(){ return Math.random().toString(36).slice(2,8); }

function encodeEvent(ev) {
  try {
    const minSlots = ev.slots.map(s => [s.date, s.start, s.end]);
    const minPayload = [
      ev.name,
      ev.type === "virtual" ? "v" : ev.type === "in-person" ? "p" : "e",
      ev.notes || "",
      ev.organizer || "",
      ev.orgEmail || "",
      ev.timezone || LOCAL_IANA_TZ,
      minSlots
    ];
    return LZString.compressToEncodedURIComponent(JSON.stringify(minPayload));
  } catch(e) { return ""; }
}

function decodeEvent(s) {
  try {
    let rawStr = LZString.decompressFromEncodedURIComponent(s);
    if (!rawStr) {
      rawStr = decodeURIComponent(escape(atob(s))); // Fallback for legacy Base64 URLs
    }
    const raw = JSON.parse(rawStr);
    if (Array.isArray(raw)) {
      const [name, typeCode, notes, organizer, orgEmail, timezone, minSlots] = raw;
      return {
        name,
        type: typeCode === "v" ? "virtual" : typeCode === "p" ? "in-person" : "either",
        notes,
        organizer,
        orgEmail,
        timezone: timezone || "America/Denver",
        slots: minSlots.map(slot => ({ id: uid(), date: slot[0], start: slot[1], end: slot[2] })),
        invitees: []
      };
    }
    return raw;
  } catch(e) { return null; }
}

function qs(sel){ return document.querySelector(sel); }
function render(html){ qs("#app").innerHTML=html; }

let state={
  slots:[
    {id:uid(),date:todayStr(),start:"18:00",end:"20:00"},
    {id:uid(),date:todayStr(),start:"20:00",end:"22:00"}
  ],
  invitees:[],
  selected:[],
  pollData:null
};

function route(){
  const hash=window.location.hash;
  if(hash.startsWith("#poll=")){
    const decoded=decodeEvent(hash.slice(6));
    if(decoded){state.pollData=decoded;showPoll();return;}
  }
  showCreate();
}

function showCreate(){
  const localAbbr = getTzAbbr(LOCAL_IANA_TZ);
  render(`
    <div class="logo">
      <h1>Hangout <em>Planner</em></h1>
      <p>No accounts · Direct links · Auto time zones</p>
    </div>
    <div class="card">
      <div class="card-title"><span class="num">1</span> Event details</div>
      <label>Event name</label>
      <input id="ev-name" type="text" placeholder="e.g. Project check-in or Game night"/>
      <label>Format</label>
      <select id="ev-type">
        <option value="virtual">Virtual</option>
        <option value="in-person">In person</option>
        <option value="either">Either works</option>
      </select>
      <label>Notes (optional)</label>
      <input id="ev-notes" type="text" placeholder="e.g. Google Meet, ~1 hr"/>
    </div>
    <div class="card">
      <div class="card-title"><span class="num">2</span> Time options <span class="tz-badge">${localAbbr}</span></div>
      <p class="hint" style="margin-bottom:0.8rem">Times will automatically convert to your invitees' local time zones when they open the link.</p>
      <div id="slots-list"></div>
      <button class="btn-sm" onclick="addSlot()">+ Add slot</button>
    </div>
    <div class="card">
      <div class="card-title"><span class="num">3</span> Your info &amp; invitees</div>
      <div class="grid2">
        <div><label>Your name</label><input id="organizer" type="text" placeholder="Your name"/></div>
        <div><label>Your email (optional)</label><input id="org-email" type="text" placeholder="for reply-to"/></div>
      </div>
      <div class="divider"></div>
      <p class="hint">Add friends to pre-fill your invite messages.</p>
      <div class="grid3" style="margin-top:0.7rem">
        <div><label>Name</label><input id="inv-name" type="text" placeholder="Friend's name"/></div>
        <div><label>Email / phone</label><input id="inv-email" type="text" placeholder="optional"/></div>
        <div style="display:flex;align-items:flex-end"><button class="btn btn-gold" onclick="addInvitee()">Add</button></div>
      </div>
      <div class="tag-wrap" id="invitees-list"></div>
    </div>
    <div class="card">
      <button class="btn-full" onclick="generateEvent()">Generate direct link →</button>
    </div>
  `);
  renderSlots();
  renderInvitees();
}

function renderSlots(){
  const el=qs("#slots-list");
  if(!el) return;
  el.innerHTML=state.slots.map((s,i)=>`
    <div class="slot-row">
      <div>${i===0?'<label>Date</label>':''}<input type="date" value="${s.date}" onchange="updSlot('${s.id}','date',this.value)"/></div>
      <div>${i===0?'<label>Start</label>':''}<input type="time" value="${s.start}" onchange="updSlot('${s.id}','start',this.value)"/></div>
      <div>${i===0?'<label>End</label>':''}<input type="time" value="${s.end}" onchange="updSlot('${s.id}','end',this.value)"/></div>
      <div style="display:flex;align-items:flex-end"><button class="btn-sm" onclick="removeSlot('${s.id}')">✕</button></div>
    </div>
  `).join("");
}

function renderInvitees(){
  const el=qs("#invitees-list");
  if(!el) return;
  el.innerHTML=state.invitees.map(inv=>`
    <span class="tag">${inv.name}${inv.email?` · ${inv.email}`:""}
      <button onclick="removeInvitee('${inv.id}')">×</button>
    </span>
  `).join("");
}

function addSlot(){ state.slots.push({id:uid(),date:todayStr(),start:"18:00",end:"20:00"}); renderSlots(); }
function updSlot(id,f,v){ state.slots=state.slots.map(s=>s.id===id?{...s,[f]:v}:s); }
function removeSlot(id){ state.slots=state.slots.filter(s=>s.id!==id); renderSlots(); }
function addInvitee(){
  const n=(qs("#inv-name")||{}).value?.trim();
  const e=(qs("#inv-email")||{}).value?.trim()||"";
  if(!n) return;
  state.invitees.push({id:uid(),name:n,email:e});
  if(qs("#inv-name")) qs("#inv-name").value="";
  if(qs("#inv-email")) qs("#inv-email").value="";
  renderInvitees();
}
function removeInvitee(id){ state.invitees=state.invitees.filter(i=>i.id!==id); renderInvitees(); }

function generateEvent(){
  const name=(qs("#ev-name")||{}).value?.trim();
  if(!name){alert("Please enter an event name.");return;}
  if(!state.slots.length){alert("Add at least one time slot.");return;}
  const ev={
    id:uid(), name,
    type:(qs("#ev-type")||{}).value||"virtual",
    notes:(qs("#ev-notes")||{}).value?.trim()||"",
    organizer:(qs("#organizer")||{}).value?.trim()||"",
    orgEmail:(qs("#org-email")||{}).value?.trim()||"",
    timezone:LOCAL_IANA_TZ,
    slots:state.slots, invitees:state.invitees, responses:[]
  };
  showShare(ev);
}

function showShare(ev){
  const compressedHash = encodeEvent(ev);
  const base = window.location.href.split("#")[0];
  const pollUrl = `${base}#poll=${compressedHash}`;
  const orgAbbr = getTzAbbr(ev.timezone);
  const typeLabel = {virtual:"virtual","in-person":"in-person",either:"virtual or in-person"}[ev.type]||"virtual";
  const from = ev.organizer || "Me";
  
  const smsMsg = `Hey! ${from} is planning a ${typeLabel} ${ev.name}${ev.notes?` (${ev.notes})`:""}.\n\nVote for your available times (auto-adjusts to your local time):\n${pollUrl}`;
  const emailSubject = `When works for you? – ${ev.name}`;
  const emailBody = `Hi${ev.invitees.length>0?" "+ev.invitees.map(i=>i.name).join(", "):""},\n\nI'm organizing a ${typeLabel} ${ev.name}${ev.notes?` (${ev.notes})`:""} and want to find a time that works for everyone.\n\nTimes automatically convert to your local time zone.\n\nClick below to vote (takes 30 seconds, no login required):\n\n${pollUrl}\n\nThanks!\n${from}${ev.orgEmail?"\n"+ev.orgEmail:""}`;
  const emailAddresses = ev.invitees.map(i=>i.email).filter(Boolean).join(",");
  const mailtoLink = `mailto:${emailAddresses}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;
  const smsLink = `sms:?&body=${encodeURIComponent(smsMsg)}`;

  render(`
    <div class="logo"><h1>Hangout <em>Planner</em></h1></div>
    <div class="card">
      <div class="card-title">🔗 Direct poll link</div>
      <p class="hint" style="margin-bottom:0.6rem">No third-party redirects. Anyone opening this link will see times converted to their local device time.</p>
      <div class="share-box" id="poll-url">${pollUrl}</div>
      <div class="btn-row">
        <button class="btn btn-gold" onclick="copyText('poll-url','cp-link')">Copy link</button>
        <span id="cp-link" style="font-size:0.78rem;color:#6fcf83;display:none">✓ Copied!</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">💬 Text message</div>
      <p class="hint" style="margin-bottom:0.6rem">Paste into your group chat or send directly.</p>
      <div class="msg-box" id="sms-msg">${smsMsg}</div>
      <div class="btn-row">
        <button class="btn btn-gold" onclick="copyText('sms-msg','cp-sms')">Copy text</button>
        <a href="${smsLink}"><button class="btn">Open in Messages</button></a>
        <span id="cp-sms" style="font-size:0.78rem;color:#6fcf83;display:none">✓ Copied!</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">✉️ Email</div>
      <p class="hint" style="margin-bottom:0.6rem">${emailAddresses?`Pre-addressed to: ${ev.invitees.filter(i=>i.email).map(i=>i.name).join(", ")}`:"No emails added — copy below or go back to add friends."}</p>
      <div class="msg-box" id="email-msg">Subject: ${emailSubject}\n\n${emailBody}</div>
      <div class="btn-row">
        <button class="btn btn-gold" onclick="copyText('email-msg','cp-email')">Copy email</button>
        <a href="${mailtoLink}"><button class="btn">Open in Mail app</button></a>
        <span id="cp-email" style="font-size:0.78rem;color:#6fcf83;display:none">✓ Copied!</span>
      </div>
    </div>
    <div class="card">
      <button class="btn-gray-full" onclick="showCreate()">← Edit event</button>
    </div>
  `);
}

function copyText(srcId,confirmId){
  const text=(qs("#"+srcId)||{}).innerText||"";
  navigator.clipboard.writeText(text).catch(()=>{});
  const el=qs("#"+confirmId);
  if(el){el.style.display="inline";setTimeout(()=>el.style.display="none",2500);}
}

function showPoll(){
  const pd = state.pollData;
  if (!pd) return;
  state.selected = [];
  
  const userAbbr = getTzAbbr(LOCAL_IANA_TZ);
  const orgAbbr = getTzAbbr(pd.timezone);
  const isDifferent = LOCAL_IANA_TZ !== pd.timezone;
  
  render(`
    <div class="poll-header">
      <h2>${pd.name}</h2>
      <p>${pd.organizer?`Organized by ${pd.organizer} · `:""}${({virtual:"Virtual","in-person":"In person",either:"Virtual or in-person"}[pd.type])||""}${pd.notes?` · ${pd.notes}`:""}</p>
    </div>
    <div class="card">
      <div class="card-title">
        Which times work for you? 
        <span class="tz-badge">${userAbbr} (Your Time)</span>
      </div>
      ${isDifferent ? `<p class="hint" style="margin-bottom:0.9rem">⚡ Times have been automatically converted from the organizer's time zone (${orgAbbr}).</p>` : ''}
      
      ${pd.slots.map(s => {
        const display = formatSlotDisplay(s.date, s.start, s.end, pd.timezone);
        return `
          <div class="slot-opt" id="opt-${s.id}" onclick="toggleSlot('${s.id}')">
            <div class="slot-chk" id="chk-${s.id}"></div>
            <div style="flex:1">
              <div class="slot-date">${display.localDate}</div>
              <div class="slot-time">${display.localTime}</div>
              ${display.orgTimeNotice ? `<div class="slot-orig">Organizer's time: ${display.orgTimeNotice}</div>` : ''}
            </div>
          </div>
        `;
      }).join("")}
    </div>
    <div class="card">
      <label>Your name</label>
      <input id="resp-name" type="text" placeholder="Enter your name"/>
      <div style="margin-top:1rem">
        <button class="btn-full" id="submit-btn" onclick="submitPoll()">Submit availability →</button>
      </div>
      <div id="submit-error"></div>
    </div>
  `);
}

function toggleSlot(id){
  const idx=state.selected.indexOf(id);
  if(idx>-1) state.selected.splice(idx,1);
  else state.selected.push(id);
  const opt=qs("#opt-"+id),chk=qs("#chk-"+id);
  if(opt) opt.classList.toggle("selected",state.selected.includes(id));
  if(chk) chk.textContent=state.selected.includes(id)?"✓":"";
}

async function submitPoll(){
  const pd=state.pollData;
  const name=(qs("#resp-name")||{}).value?.trim();
  if(!name){alert("Please enter your name.");return;}
  if(!state.selected.length){alert("Select at least one time.");return;}
  const btn=qs("#submit-btn");
  if(btn){btn.innerHTML='<span class="spinner"></span>Saving…';btn.disabled=true;}
  
  const slotLabels = state.selected.map(id => {
    const s = pd.slots.find(sl => sl.id === id);
    if (!s) return id;
    const disp = formatSlotDisplay(s.date, s.start, s.end, pd.timezone);
    return disp.fullLabel;
  });
  
  try{
    await fetch(SHEET_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,event:pd.name,slots:slotLabels})
    });
    showSuccess(name,slotLabels,pd.name);
  }catch(err){
    const errEl=qs("#submit-error");
    if(errEl) errEl.innerHTML=`<div class="error-box">Something went wrong — please try again.</div>`;
    if(btn){btn.innerHTML="Submit availability →";btn.disabled=false;}
  }
}

function showSuccess(name,slotLabels,eventName){
  render(`
    <div class="logo"><h1>Hangout <em>Planner</em></h1></div>
    <div class="card">
      <div class="success-box">
        <h3>✓ You're in!</h3>
        <p>Thanks <strong>${name}</strong> — your availability for <strong>${eventName}</strong> has been recorded.</p>
        <p style="margin-top:0.6rem">Your picks:<br/>${slotLabels.map(l=>`<strong>${l}</strong>`).join("<br/>")}</p>
      </div>
      <p class="hint" style="margin-top:1rem;text-align:center">The organizer will follow up once they find the best time for everyone.</p>
    </div>
  `);
}

route();
</script>
</body>
</html>
